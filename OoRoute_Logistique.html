#lg .lg-card{position:relative;z-index:2;width:min(380px,100%);background:#fff;border-radius:14px;padding:30px 28px 24px;box-shadow:0 24px 70px rgba(0,0,0,.35)}
#lg .lg-brand{display:flex;gap:12px;align-items:center;margin-bottom:22px}
#lg .lg-mark{width:42px;height:42px;border-radius:10px;background:#E4141C;color:#fff;display:grid;place-items:center;font-weight:800;font-size:23px;letter-spacing:-1px}
#lg .lg-brand b{display:block;font-size:17px;line-height:1.15}
#lg .lg-brand span{font-size:12.5px;color:#666674}
#lg label{display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:#666674;margin-bottom:14px}
#lg input[type=text],#lg input[type=password]{font:inherit;font-size:15px;padding:10px 12px;border:1px solid #D5D5DB;border-radius:8px;background:#fff;color:#1E1E24;width:100%}
#lg input:focus{outline:2px solid #E4141C;outline-offset:1px;border-color:#E4141C}
#lg .lg-show{flex-direction:row;align-items:center;gap:8px;margin:-4px 0 16px;cursor:pointer}
#lg button{font:inherit;width:100%;border:0;border-radius:8px;background:#E4141C;color:#fff;padding:11px 14px;font-size:15px;font-weight:600;cursor:pointer}
#lg button:hover{background:#C40F17}
#lg button:disabled{opacity:.65;cursor:wait}
#lg .lg-err{min-height:20px;margin:0 0 10px;color:#C0261F;font-size:13px;font-weight:600}
#lg .lg-foot{margin:16px 0 0;font-size:11.5px;color:#8A8A96;text-align:center}

#lg::before{filter:blur(10px) saturate(.85);opacity:.5}
#lg::after{background:radial-gradient(900px 520px at 82% -5%,rgba(228,20,28,.30),transparent 62%),linear-gradient(160deg,rgba(10,20,29,.90),rgba(6,12,18,.97))}
#lg .lg-card{width:min(420px,100%);background:linear-gradient(180deg,#172A3A,#101E2B);border:1px solid rgba(135,165,190,.24);color:#E6EDF3;box-shadow:0 30px 80px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.05)}
#lg .lg-logo svg{height:34px;width:auto;display:block}
#lg .lg-brand{margin:18px 0 22px;padding-top:16px;border-top:1px solid rgba(135,165,190,.22)}
#lg .lg-brand b{color:#fff;font-size:20px;letter-spacing:-.3px}
#lg .lg-brand span{display:block;margin-top:4px;color:#8FA3B3;font-size:13.5px;line-height:1.4}
#lg label{color:#8FA3B3}
#lg input[type=text],#lg input[type=password]{background:#0D1A25;border-color:rgba(135,165,190,.30);color:#E6EDF3}
#lg input:focus{outline-color:#E4141C;border-color:#E4141C}
#lg button{background:linear-gradient(180deg,#F0212A,#D3121B);box-shadow:0 10px 24px -12px rgba(228,20,28,.95)}
#lg button:hover{background:linear-gradient(180deg,#FF2E37,#DB1720)}
#lg .lg-err{color:#FF6B71}
#lg .lg-foot{color:#6F8395}
</style>
</head>

<div id="lg">
  <div class="lg-banner" aria-hidden="true"></div>
  <div class="lg-card">
    <div class="lg-logo"><svg class="oo-logo" viewBox="0 0 178 40" role="img" aria-label="Ooredoo"><circle cx="20" cy="20" r="13.5" fill="none" stroke="#E4141C" stroke-width="5.5"/><circle cx="20" cy="20" r="4.6" fill="#E4141C"/><circle cx="33.5" cy="8.5" r="3" fill="#FF6B71"/><text x="46" y="29" font-size="27" font-weight="800" letter-spacing="-.6" fill="#fff" font-family="'Nunito','Segoe UI Variable','Segoe UI',Arial,sans-serif">ooredoo</text></svg></div><div class="lg-brand"><div><b>OoRoute</b><span>Bienvenue sur votre espace de planification et de suivi des coûts</span></div></div>

      <label>Mot de passe<input type="password" id="lg-p" name="password" autocomplete="current-password" required></label>
      <label class="lg-show"><input type="checkbox" id="lg-s"> Afficher le mot de passe</label>
      <p class="lg-err" id="lg-e" role="alert"></p>
      <button type="submit" id="lg-b">Se connecter</button>
    </form>
    <p class="lg-foot">Accès réservé. Le contenu de cette page est chiffré.</p>
  </div>

<script>
(function(){
  var ITER=310000, enc=new TextEncoder(), dec=new TextDecoder();
  function b64e(buf){var a=new Uint8Array(buf),s='';for(var i=0;i<a.length;i+=8192)s+=String.fromCharCode.apply(null,a.subarray(i,i+8192));return btoa(s)}
  function b64d(s){var b=atob(s),a=new Uint8Array(b.length);for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a}
  function deriveKey(user,pass,salt,iter,usage){
    return crypto.subtle.importKey('raw',enc.encode(user.trim().toLowerCase()+'\u0000'+pass),'PBKDF2',false,['deriveKey'])
      .then(function(km){return crypto.subtle.deriveKey({name:'PBKDF2',salt:salt,iterations:iter,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,[usage])});
  }
  async function seal(payload,user,pass){
    var salt=crypto.getRandomValues(new Uint8Array(16)), iv=crypto.getRandomValues(new Uint8Array(12));
    var key=await deriveKey(user,pass,salt,ITER,'encrypt');
    var ct=await crypto.subtle.encrypt({name:'AES-GCM',iv:iv},key,enc.encode(JSON.stringify(payload)));
    var blob=JSON.stringify({s:b64e(salt),v:b64e(iv),i:ITER,c:b64e(ct)});
    return payload.shell.split('__BLO'+'B__').join(blob);
  }
  window.__seal=seal;
  async function open(user,pass){
    var b=JSON.parse(document.getElementById('blob').textContent);
    var key=await deriveKey(user,pass,b64d(b.s),b.i,'decrypt');
    var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64d(b.v)},key,b64d(b.c));
    return JSON.parse(dec.decode(pt));
  }
  function mount(P){
    window.__PAYLOAD=P;
    var st=document.createElement('style');st.textContent=P.style;document.head.appendChild(st);
    document.getElementById('lg').remove();document.getElementById('lg-css').remove();
    document.body.insertAdjacentHTML('afterbegin',P.body);
    var sc=document.createElement('script');sc.textContent=P.script;document.body.appendChild(sc);
  }
  var f=document.getElementById('lg-form'),e=document.getElementById('lg-e'),btn=document.getElementById('lg-b'),pw=document.getElementById('lg-p');
  document.getElementById('lg-s').addEventListener('change',function(x){pw.type=x.target.checked?'text':'password'});
  if(!(window.crypto&&crypto.subtle)){
    e.textContent="Ce navigateur ne permet pas le déchiffrement sécurisé. Ouvrez le fichier directement depuis votre ordinateur ou via une adresse https://.";
    btn.disabled=true;
  }
  f.addEventListener('submit',async function(ev){
    ev.preventDefault();e.textContent='';btn.disabled=true;btn.textContent='Vérification…';
    var u=document.getElementById('lg-u').value;
    try{
      var P=await open(u,pw.value);
      mount(P);
    }catch(err){
      await new Promise(function(r){setTimeout(r,700)});
      e.textContent='Identifiant ou mot de passe incorrect.';
      pw.value='';pw.focus();btn.disabled=false;btn.textContent='Se connecter';
    }
  });
})();
</script>
